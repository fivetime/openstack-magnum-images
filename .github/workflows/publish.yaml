# SPDX-License-Identifier: Apache-2.0
#
# Build every maintained Kubernetes version, on every supported OS and
# architecture; publishing anywhere is opt-in.
#
# There is no committed version list and no bump pull request: the matrix is
# discovered at run time from endoflife.date (which minors are maintained) and
# dl.k8s.io (the newest patch of each), and anything already built is skipped.
# Following upstream Kubernetes therefore costs no human action.
#
# WHERE THE BYTES GO
#
# A built image is 3.3 GB, and moving one between this datacenter and GitHub
# measured at ~0.6 MB/s: 25 minutes for a single image, longer than building it
# and, across the matrix, longer than everything else combined. So the image
# never crosses that boundary. It is built, uploaded to Glance and booted all
# on the same runner, in one job.
#
# That runner is ephemeral - the RaaS pool hands out a fresh VM per job and
# destroys it afterwards - so there is nothing to hand off between jobs and no
# cache to keep. Rebuilding costs about four minutes, which is cheaper than
# every mechanism that would avoid it.
#
# What does leave is the manifest and a checksum, a few hundred bytes. Each
# matrix job uploads those as an artifact; one aggregating job collects them
# and cuts the releases. A GitHub Release is therefore the record of what was
# built, not a copy of it - the image lives in Glance, which is where it is
# used.
#
# ci.yaml and bump.yaml are left untouched (and disabled in this fork) so
# merges from vexxhost/capo-image-elements never conflict.
name: publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when this combination was already built
        type: boolean
        default: false
      # The four below narrow a run to one combination. Left empty they keep
      # the discovered behaviour, so the scheduled run is unaffected.
      k8s:
        description: 'Kubernetes versions, space separated (empty: discover)'
        type: string
        default: ""
      os:
        description: 'OS entries name/version/element/release (empty: all)'
        type: string
        default: ""
      arch:
        description: Architectures, space separated
        type: string
        default: "amd64 arm64"
      elements:
        description: Extra diskimage-builder elements
        type: string
        # The image carries every isolation level a tenant might ask for, so
        # that choosing between them is a `runtimeClassName` in the tenant's
        # own YAML rather than a different image and a different cluster:
        #
        #   crun     replaces runc as what containerd executes
        #   gvisor   runsc, a userspace kernel; no /dev/kvm needed
        #   kata     a real VM per pod, with QEMU and cloud-hypervisor
        #
        # A handler is all the image can carry. A RuntimeClass is a cluster
        # object, so nothing schedules onto any of these until one exists
        # naming the handler; magnum-cluster-api creates them per cluster
        # (resources.py, NODE_IMAGE_RUNTIME_HANDLERS), and that list has to
        # stay in step with this one - a RuntimeClass whose handler is missing
        # on the node admits the pod and then fails it at container creation,
        # which is far harder to diagnose than being refused up front.
        #
        # kata is what makes DIB_IMAGE_SIZE 12 rather than 3 - since 4.1.0 it
        # is two tarballs, runtime-rs and the Go runtime, because runtime-rs
        # cannot currently start a QEMU sandbox here. That is store space in
        # Glance, not boot cost: the images are raw and Glance's backend is
        # RBD, so nodes CoW-clone them instead of copying.
        default: "node-tuning containerd-conf-d crun gvisor kata"
      release:
        description: Publish the manifest and checksum to a GitHub Release
        type: boolean
        default: false
      glance:
        description: Upload to Glance and run the acceptance gate
        type: boolean
        default: false
  schedule:
    # Nightly. Most runs discover nothing new and cost one API call.
    - cron: "0 3 * * *"

permissions: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      empty: ${{ steps.discover.outputs.empty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: discover
        run: ./hack/discover.sh
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
          K8S_LIST: ${{ inputs.k8s }}
          OS_LIST: ${{ inputs.os }}
          ARCH_LIST: ${{ inputs.arch }}
          RUNNER_AMD64: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04' }}

  # Build, upload to Glance and boot the result, all on one runner, because
  # moving the image between runners costs more than everything else here.
  build:
    needs: discover
    if: needs.discover.outputs.empty != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # One broken distro must not hold up the rest.
      # The gate boots a VM, so serialise: the cloud also runs RaaS, and a
      # matrix-wide burst of instances queues behind its pool refills.
      max-parallel: 1
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
    env:
      NAME: ${{ matrix.os_name }}-${{ matrix.os_version }}-v${{ matrix.k8s }}-${{ matrix.arch }}
      # matrix.in_datacenter is the half that is easy to forget: a GitHub-hosted
      # runner has no route to the OpenStack API, so asking it to upload builds
      # the image and then fails on a connection that could never have worked.
      # That is what every arm64 job did until this was added.
      GLANCE: ${{ (inputs.glance == true || vars.GLANCE_ENABLED == 'true') && matrix.in_datacenter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: step-security/setup-uv@edab89485182ad96613ff847804c272ab5d1e03f # v10.0.0
        with:
          enable-cache: true
      - run: uv sync

      # apt-get update first. GitHub-hosted runners ship with populated package
      # lists, so upstream's ci.yaml can install straight away; the RaaS runner
      # image is built from the same base but without them, and the install
      # fails with "Unable to locate package debootstrap". Updating is correct
      # on both.
      - name: Install the diskimage-builder dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y $(uv run bindep -b)

      # The OpenStack API is published only under names the datacenter's own
      # resolver knows. A RaaS runner does not use it: its subnet hands out no
      # DNS server (dns_nameservers is ['::']) and the image falls back to a
      # public resolver, so it reaches GitHub but gets NXDOMAIN for
      # keystone.openstack.svc.cluster.local.
      #
      # The gateway routes by Host header, so the name has to stay in the URL -
      # an IP would match no HTTPRoute. Seeding /etc/hosts keeps the name and
      # supplies the address, without changing the runner image or the subnet.
      #
      # Set OS_GATEWAY_VIP to the gateway address (v4, v6, or both separated by
      # spaces). Unset, this step does nothing and a runner that already
      # resolves these names is unaffected.
      - name: Point the OpenStack public names at the gateway
        if: env.GLANCE == 'true' && vars.OS_GATEWAY_VIP != ''
        run: |
          services="keystone glance nova neutron cinder magnum octavia barbican placement"
          for ip in ${{ vars.OS_GATEWAY_VIP }}; do
              names=""
              for svc in $services; do
                  names="$names ${svc}.openstack.svc.cluster.local ${svc}.openstack ${svc}"
              done
              echo "${ip}${names}" | sudo tee -a /etc/hosts
          done
          getent hosts keystone.openstack.svc.cluster.local

      # The runner image is GitHub's, which carries no OpenStack client. Put it
      # in a throwaway venv rather than asking for a modified runner image:
      # anything that runs on a GitHub-hosted runner then runs here unchanged.
      - name: Install the OpenStack client
        if: env.GLANCE == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/osc"
          "$RUNNER_TEMP/osc/bin/pip" -q install python-openstackclient python-magnumclient
          echo "$RUNNER_TEMP/osc/bin" >> "$GITHUB_PATH"

      # diskimage-builder untars the base rootfs preserving ownership, which
      # needs a tar that can set uid/gid.
      - if: matrix.element == 'ubuntu-minimal'
        run: sudo chown root /bin/tar && sudo chmod u+s /bin/tar

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/image-create
          key: ${{ matrix.element }}-${{ matrix.release }}-${{ matrix.arch }}-${{ matrix.k8s }}
          restore-keys: |
            ${{ matrix.element }}-${{ matrix.release }}-${{ matrix.arch }}-
            ${{ matrix.element }}-${{ matrix.release }}-

      # diskimage-builder does much of its work as root, so the cache it
      # produces contains root-owned entries. actions/cache restores them with
      # `tar -P`, which preserves that ownership - and then dib's very first
      # step, mkdir ~/.cache/dib, fails with EACCES for the runner user.
      #
      # This only bites on a cache hit, which is why a first, cold run passes
      # and the next one does not.
      - name: Make the restored cache writable
        run: |
          sudo mkdir -p "$HOME/.cache"
          sudo chown -R "$(id -un):$(id -gn)" "$HOME/.cache"

      # Resolve the runtime stack at build time rather than carrying pinned
      # defaults in the elements. Writes CONTAINERD_VERSION and friends into
      # $GITHUB_ENV for the build step below.
      - name: Resolve component versions
        run: ./hack/versions.sh "${{ matrix.k8s }}"
        env:
          GH_TOKEN: ${{ github.token }}
          CONTAINERD_SERIES: ${{ vars.CONTAINERD_SERIES }}

      # raw only: Glance can CoW-clone a raw image that sits in the RBD store,
      # while a qcow2 forces a full copy on every node boot - the cost this
      # pipeline exists to avoid. EXTRA_ELEMENTS carries the local additions;
      # keep its default in step with the `elements` input above.
      - name: Build
        run: |
          uv run disk-image-create -t raw -o "${NAME}" \
            vm "${{ matrix.element }}" block-device-kubernetes kubernetes \
            ${EXTRA_ELEMENTS}
        env:
          EXTRA_ELEMENTS: ${{ inputs.elements || vars.EXTRA_ELEMENTS || 'node-tuning containerd-conf-d crun gvisor kata' }}
          ELEMENTS_PATH: ${{ github.workspace }}/elements
          DIB_RELEASE: ${{ matrix.release }}
          DIB_KUBERNETES_VERSION: ${{ matrix.k8s }}
          # The elements already read these; resolving them here is what makes
          # the image carry the newest runtime instead of a stale default.
          DIB_CONTAINERD_VERSION: ${{ env.CONTAINERD_VERSION }}
          DIB_RUNC_VERSION: ${{ env.RUNC_VERSION }}
          DIB_CNI_PLUGINS_VERSION: ${{ env.CNI_PLUGINS_VERSION }}
          DIB_CRI_TOOLS_VERSION: ${{ env.CRI_TOOLS_VERSION }}
          # Only read when the crun / kata elements are in the build.
          DIB_CRUN_VERSION: ${{ env.CRUN_VERSION }}
          DIB_KATA_VERSION: ${{ env.KATA_VERSION }}
          DIB_MIN_TMPFS: "4"
          DIB_CLOUD_INIT_GROWPART_DEVICES: '["/"]'
          DIB_SKIP_BASE_PACKAGE_INSTALL: "1"
          # 12 GB, because the default element set includes kata, and kata
          # is two tarballs since 4.1.0 - runtime-rs and the Go runtime, about
          # 3.8 GB together once the 87 paths they share are counted once.
          # Building the default set at 3 fails on a full filesystem rather
          # than on anything informative.
          #
          # Larger is close to free here and the reason is worth keeping: the
          # image is raw and Glance stores it in RBD, so a node CoW-clones it.
          # The flavour's root disk has to hold it, which magnum-medium's 40 GB
          # does several times over.
          DIB_IMAGE_SIZE: ${{ vars.DIB_IMAGE_SIZE || '12' }}

      # A build that finished is not a build that is correct. Read the claims
      # back out of the filesystem before anything downstream trusts them.
      - name: Verify and write manifest
        run: |
          sudo -E ./hack/verify-image.sh "${NAME}.raw" "${NAME}.manifest.json" \
            "${{ matrix.os_name }}" "${{ matrix.os_version }}" \
            "${{ matrix.k8s }}" "${{ matrix.arch }}"
          sha256sum "${NAME}.raw" | awk '{print $1}' > "${NAME}.raw.sha256"
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}

      # Uploaded private. Only the gate makes an image public.
      - name: Upload to Glance
        if: env.GLANCE == 'true'
        run: ./hack/glance/push.sh "${NAME}.raw" "${NAME}.manifest.json"
        env:
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
          OS_PROJECT_DOMAIN_NAME: ${{ secrets.OS_PROJECT_DOMAIN_NAME }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
          OS_IDENTITY_API_VERSION: "3"
          # The public endpoints resolve throughout this datacenter; the
          # internal ones are ClusterIP names that only resolve inside the
          # Kubernetes cluster, and elsewhere land on the gateway VIP where
          # nothing listens on the service port - a timeout, not an NXDOMAIN.
          OS_INTERFACE: ${{ vars.OS_INTERFACE || 'public' }}
          IMAGE_STORE: ${{ vars.GLANCE_IMAGE_STORE || 'rbd' }}
          IMAGE_ID_FILE: image-id.txt

      # Writes boot_verified back into the manifest, which is what the release
      # job reads: it cannot ask Glance whether a node ever booted.
      - name: Acceptance gate
        if: env.GLANCE == 'true'
        run: ./hack/gate.sh "$(cat image-id.txt)" "${NAME}.manifest.json"
        env:
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
          OS_PROJECT_DOMAIN_NAME: ${{ secrets.OS_PROJECT_DOMAIN_NAME }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
          OS_IDENTITY_API_VERSION: "3"
          OS_INTERFACE: ${{ vars.OS_INTERFACE || 'public' }}
          # Redundant with the GLANCE guard above, which already keeps this step
          # from running off-site; kept because it is the gate's own contract -
          # it cannot boot an image for an architecture this cloud has no
          # compute for, whatever runner asked it to.
          SKIP_GATE: ${{ matrix.arch != 'amd64' }}
          GATE_FLAVOR: ${{ vars.GATE_FLAVOR || 'magnum-medium' }}
          GATE_DNS: ${{ vars.GATE_DNS || '192.168.4.254' }}

      # Metadata only - a few hundred bytes, so this crosses to GitHub in a
      # second. The image stays here.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meta-${{ env.NAME }}
          path: |
            ${{ env.NAME }}.manifest.json
            ${{ env.NAME }}.raw.sha256
          if-no-files-found: error
          retention-days: 7

  # One job, not a matrix: every build hands its metadata over as an artifact,
  # and this collects them all and cuts one release per Kubernetes version.
  # Doing it here rather than from each matrix job avoids several runners
  # racing to create the same tag, and needs no serialisation to be correct.
  release:
    needs: [discover, build]
    if: >-
      needs.discover.outputs.empty != 'true' &&
      (inputs.release == true || vars.RELEASE_ENABLED == 'true')
    runs-on: ubuntu-latest        # metadata only; no reason to occupy a build VM
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: meta-*
          merge-multiple: true
          path: meta

      - name: Cut one release per Kubernetes version
        run: |
          set -Eeuo pipefail
          cd meta
          ls -l

          # Group by the version recorded in each manifest rather than by file
          # name: the manifest is what the build actually produced.
          for k8s in $(jq -r '.k8s_version' ./*.manifest.json | sort -uV); do
              tag="v${k8s}"
              files=$(grep -l "\"k8s_version\": \"${k8s}\"" ./*.manifest.json)

              gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
                gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                  --prerelease --title "$tag" \
                  --notes "Node image manifests for Kubernetes ${tag}. The images themselves are published to Glance; a release is the record of what was built. Prerelease until the acceptance gate has booted a node on them."

              for m in $files; do
                  gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
                      "$m" "${m%.manifest.json}.raw.sha256"
              done

              # Promote only when every manifest for this version says a node
              # actually booted on the image. An arm64 build never can - there
              # is no arm64 compute here - so a version that includes one stays
              # a prerelease, which is the honest state.
              if [ "$(jq -s 'all(.[]; .boot_verified == true)' $files)" = true ]; then
                  gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
                      --prerelease=false --latest
                  echo "$tag promoted: every image booted"
              else
                  echo "$tag stays a prerelease: not every image was gated"
              fi
          done
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
