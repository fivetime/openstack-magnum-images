# SPDX-License-Identifier: Apache-2.0
#
# Build every maintained Kubernetes version, on every supported OS and
# architecture; publishing anywhere is opt-in.
#
# There is no committed version list and no bump pull request: the matrix is
# discovered at run time from endoflife.date (which minors are maintained) and
# dl.k8s.io (the newest patch of each), and anything already built is skipped.
# Following upstream Kubernetes therefore costs no human action.
#
# WHERE THE BYTES GO
#
# A built image is 3.3 GB. Moving one between this datacenter and GitHub was
# measured at ~0.6 MB/s - 25 minutes for a single image, more than the build
# itself, and over the full matrix more than everything else combined. So the
# large files never cross that boundary in either direction:
#
#   amd64  built on a self-hosted runner in the datacenter, and read from a
#          local cache by the Glance upload. Nothing leaves.
#   arm64  built on GitHub's arm runner and, if Releases are enabled, uploaded
#          there. It is not pushed to Glance - there is no arm64 compute here -
#          so nothing comes back.
#
# A GitHub Release therefore carries the manifest and a checksum, not the
# image. The image itself lives in Glance, which is where it gets used.
#
# ci.yaml and bump.yaml are left untouched (and disabled in this fork) so
# merges from vexxhost/capo-image-elements never conflict.
name: publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when this combination was already built
        type: boolean
        default: false
      # The four below narrow a run to one combination. Left empty they keep
      # the discovered behaviour, so the scheduled run is unaffected.
      k8s:
        description: 'Kubernetes versions, space separated (empty: discover)'
        type: string
        default: ""
      os:
        description: 'OS entries name/version/element/release (empty: all)'
        type: string
        default: ""
      arch:
        description: Architectures, space separated
        type: string
        default: "amd64 arm64"
      elements:
        description: Extra diskimage-builder elements
        type: string
        default: "node-tuning"
      release:
        description: Publish the manifest and checksum to a GitHub Release
        type: boolean
        default: false
      glance:
        description: Upload to Glance and run the acceptance gate
        type: boolean
        default: false
  schedule:
    # Nightly. Most runs discover nothing new and cost one API call.
    - cron: "0 3 * * *"

permissions: {}

env:
  # Where a finished image waits between jobs. Living outside the workspace is
  # what lets the Glance upload be re-run on its own after a failure, without
  # rebuilding and without fetching 3.3 GB back from GitHub.
  IMAGE_CACHE: ${{ vars.IMAGE_CACHE || '/var/lib/magnum-images' }}

jobs:
  discover:
    # On the build runner when there is one: it can see the local image cache,
    # which is the record of what has been built when Releases are off.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      empty: ${{ steps.discover.outputs.empty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: discover
        run: ./hack/discover.sh
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
          K8S_LIST: ${{ inputs.k8s }}
          OS_LIST: ${{ inputs.os }}
          ARCH_LIST: ${{ inputs.arch }}
          RUNNER_AMD64: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04' }}

  build:
    needs: discover
    if: needs.discover.outputs.empty != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # One broken distro must not hold up the rest; each entry publishes on
      # its own.
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
    env:
      NAME: ${{ matrix.os_name }}-${{ matrix.os_version }}-v${{ matrix.k8s }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: step-security/setup-uv@edab89485182ad96613ff847804c272ab5d1e03f # v10.0.0
        with:
          enable-cache: true
      - run: uv sync
      - run: sudo apt-get install -y $(uv run bindep -b)

      # diskimage-builder untars the base rootfs preserving ownership, which
      # needs a tar that can set uid/gid.
      - if: matrix.element == 'ubuntu-minimal'
        run: sudo chown root /bin/tar && sudo chmod u+s /bin/tar

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/image-create
          key: ${{ matrix.element }}-${{ matrix.release }}-${{ matrix.arch }}-${{ matrix.k8s }}
          restore-keys: |
            ${{ matrix.element }}-${{ matrix.release }}-${{ matrix.arch }}-
            ${{ matrix.element }}-${{ matrix.release }}-

      # diskimage-builder does much of its work as root, so the cache it
      # produces contains root-owned entries. actions/cache restores them with
      # `tar -P`, which preserves that ownership - and then dib's very first
      # step, mkdir ~/.cache/dib, fails with EACCES for the runner user.
      #
      # This only bites on a cache hit, which is why a first, cold run passes
      # and the next one does not.
      - name: Make the restored cache writable
        run: |
          sudo mkdir -p "$HOME/.cache"
          sudo chown -R "$(id -un):$(id -gn)" "$HOME/.cache"

      # Resolve the runtime stack at build time rather than carrying pinned
      # defaults in the elements. Writes CONTAINERD_VERSION and friends into
      # $GITHUB_ENV for the build step below.
      - name: Resolve component versions
        run: ./hack/versions.sh "${{ matrix.k8s }}"
        env:
          GH_TOKEN: ${{ github.token }}
          CONTAINERD_SERIES: ${{ vars.CONTAINERD_SERIES }}

      # raw only: Glance can CoW-clone a raw image that sits in the RBD store,
      # while a qcow2 forces a full copy on every node boot - the cost this
      # pipeline exists to avoid. EXTRA_ELEMENTS carries the local additions;
      # node-tuning is on by default, add gvisor for a runsc runtime handler.
      - name: Build
        run: |
          uv run disk-image-create -t raw -o "${NAME}" \
            vm "${{ matrix.element }}" block-device-kubernetes kubernetes \
            ${EXTRA_ELEMENTS}
        env:
          EXTRA_ELEMENTS: ${{ inputs.elements || vars.EXTRA_ELEMENTS || 'node-tuning' }}
          ELEMENTS_PATH: ${{ github.workspace }}/elements
          DIB_RELEASE: ${{ matrix.release }}
          DIB_KUBERNETES_VERSION: ${{ matrix.k8s }}
          # The elements already read these; resolving them here is what makes
          # the image carry the newest runtime instead of a stale default.
          DIB_CONTAINERD_VERSION: ${{ env.CONTAINERD_VERSION }}
          DIB_RUNC_VERSION: ${{ env.RUNC_VERSION }}
          DIB_CNI_PLUGINS_VERSION: ${{ env.CNI_PLUGINS_VERSION }}
          DIB_CRI_TOOLS_VERSION: ${{ env.CRI_TOOLS_VERSION }}
          DIB_MIN_TMPFS: "4"
          DIB_CLOUD_INIT_GROWPART_DEVICES: '["/"]'
          DIB_SKIP_BASE_PACKAGE_INSTALL: "1"
          DIB_IMAGE_SIZE: "3"

      # A build that finished is not a build that is correct. Read the claims
      # back out of the filesystem before anything downstream trusts them.
      - name: Verify and write manifest
        run: |
          sudo -E ./hack/verify-image.sh "${NAME}.raw" "${NAME}.manifest.json" \
            "${{ matrix.os_name }}" "${{ matrix.os_version }}" \
            "${{ matrix.k8s }}" "${{ matrix.arch }}"
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}

      # Into the cache uncompressed: the only consumer inside the datacenter is
      # the Glance upload, which needs the raw anyway, and gzipping 3.3 GB to
      # immediately gunzip it again buys nothing.
      - name: Cache the image
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 755 "$IMAGE_CACHE"
          sha256sum "${NAME}.raw" | awk '{print $1}' > "${NAME}.raw.sha256"
          mv -f "${NAME}.raw" "${NAME}.manifest.json" "${NAME}.raw.sha256" "$IMAGE_CACHE/"
          # Keep the cache from growing without bound. Anything older than
          # IMAGE_CACHE_DAYS has either been consumed or been superseded.
          find "$IMAGE_CACHE" -maxdepth 1 -type f \
               -mtime "+${{ vars.IMAGE_CACHE_DAYS || 7 }}" -delete || true
          ls -lh "$IMAGE_CACHE" | tail -20

  # Optional. Carries the manifest and the checksum - the record of what was
  # built and from what - not the image. Uploading 3.3 GB out of the datacenter
  # costs more than everything else in this pipeline put together, and the only
  # consumer of the bytes is Glance, which reads them locally.
  release:
    needs: [discover, build]
    if: >-
      needs.discover.outputs.empty != 'true' &&
      (inputs.release == true || vars.RELEASE_ENABLED == 'true')
    # The same runner as the build: that is where the files are.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1          # one release per version; avoid create races
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    permissions:
      contents: write
    env:
      NAME: ${{ matrix.os_name }}-${{ matrix.os_version }}-v${{ matrix.k8s }}-${{ matrix.arch }}
    steps:
      - name: Upload manifest and checksum
        run: |
          cd "$IMAGE_CACHE"
          gh release view "v${{ matrix.k8s }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "v${{ matrix.k8s }}" --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "v${{ matrix.k8s }}" \
              --notes "Node image manifests for Kubernetes v${{ matrix.k8s }}. The images themselves are published to Glance; a release is the record of what was built. Prerelease until the acceptance gate has booted a node on them."
          gh release upload "v${{ matrix.k8s }}" --repo "$GITHUB_REPOSITORY" --clobber \
            "${NAME}.manifest.json" "${NAME}.raw.sha256"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}

  # Optional, and amd64 only - there is no arm64 compute in this cloud, so an
  # arm64 image could be uploaded but never booted, and it would have to be
  # fetched back from GitHub to get here.
  glance:
    needs: [discover, build]
    if: >-
      needs.discover.outputs.empty != 'true' &&
      (inputs.glance == true || vars.GLANCE_ENABLED == 'true')
    # The build runner, because that is where the cached image is. Re-running
    # this job alone after a failure therefore costs no rebuild and no
    # download - which is the whole point of the cache.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # The gate boots a VM per entry. Serialise so the cloud is not asked for
      # the whole matrix at once, and so it does not fight RaaS for compute.
      max-parallel: 1
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
    env:
      NAME: ${{ matrix.os_name }}-${{ matrix.os_version }}-v${{ matrix.k8s }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the cached image is there
        run: |
          test -f "$IMAGE_CACHE/${NAME}.raw" ||
            { echo "no cached image at $IMAGE_CACHE/${NAME}.raw"; exit 1; }
          sha256sum -c <<<"$(cat "$IMAGE_CACHE/${NAME}.raw.sha256")  $IMAGE_CACHE/${NAME}.raw"

      # Uploaded private. Only the gate makes an image public.
      - name: Upload to Glance
        run: |
          ./hack/glance/push.sh \
            "$IMAGE_CACHE/${NAME}.raw" "$IMAGE_CACHE/${NAME}.manifest.json"
        env:
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
          OS_PROJECT_DOMAIN_NAME: ${{ secrets.OS_PROJECT_DOMAIN_NAME }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
          OS_IDENTITY_API_VERSION: "3"
          # The public endpoints resolve throughout this datacenter; the
          # internal ones are ClusterIP names that only resolve inside the
          # Kubernetes cluster, and elsewhere land on the gateway VIP where
          # nothing listens on the service port - a timeout, not an NXDOMAIN.
          OS_INTERFACE: ${{ vars.OS_INTERFACE || 'public' }}
          IMAGE_STORE: ${{ vars.GLANCE_IMAGE_STORE || 'rbd' }}
          IMAGE_ID_FILE: image-id.txt

      - name: Acceptance gate
        run: ./hack/gate.sh "$(cat image-id.txt)" "$IMAGE_CACHE/${NAME}.manifest.json"
        env:
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
          OS_PROJECT_DOMAIN_NAME: ${{ secrets.OS_PROJECT_DOMAIN_NAME }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
          OS_IDENTITY_API_VERSION: "3"
          OS_INTERFACE: ${{ vars.OS_INTERFACE || 'public' }}
          SKIP_GATE: ${{ matrix.arch != 'amd64' }}
          GATE_FLAVOR: ${{ vars.GATE_FLAVOR || 'magnum-medium' }}
          GATE_DNS: ${{ vars.GATE_DNS || '192.168.4.254' }}

      # Only a booted node turns a prerelease into a release, and only when
      # there is a release to promote.
      - name: Promote the release
        if: inputs.release == true || vars.RELEASE_ENABLED == 'true'
        continue-on-error: true
        run: |
          gh release edit "v${{ matrix.k8s }}" --repo "$GITHUB_REPOSITORY" \
            --prerelease=false --latest
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
