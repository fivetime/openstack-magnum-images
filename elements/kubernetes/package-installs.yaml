# NOTE(fitbeard): We don't need cockpit on Rocky Linux.
# NODE_OS_FAMILY (environment.d/50-os-family) is `redhat` for every EL rebuild
# we build - Rocky Linux and AlmaLinux - so the EL-only entries below apply to
# all of them. `when:` can only compare one variable against one value.
cockpit-ws:
  uninstall: true
  when: NODE_OS_FAMILY = redhat
cockpit-system:
  uninstall: true
  when: NODE_OS_FAMILY = redhat
# NOTE(fitbeard): Uninstalling 'linux-firmware' package
#                 saves 400Mb of final image size.
linux-firmware:
  uninstall: true
  when: DISTRO_NAME != debian
logrotate:
lvm2:
# A node is a Nova VM: the agent is what `openstack server set --password`
# goes through (with hw_qemu_guest_agent=yes on the image). Debian, Ubuntu and
# the EL rebuilds all start it from a udev rule when the virtio-serial port
# appears, so there is nothing to enable.
qemu-guest-agent:
# NOTE(fitbeard): Use plain systemd-networkd for Debian and Rocky Linux.
systemd-networkd:
  when: NODE_OS_FAMILY = redhat
systemd-resolved:
  when: DISTRO_NAME != ubuntu
