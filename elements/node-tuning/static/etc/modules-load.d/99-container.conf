# Container runtime
overlay
br_netfilter

# Bond and VLAN
# NOTE: loading bonding creates bond0 unless max_bonds=0, which
# modprobe.d/99-bonding.conf sets. A stray bond0 confuses CNI interface
# enumeration on a node that has exactly one NIC.
bonding
8021q

# Connection tracking (OVN/Kubernetes)
# NOTE: nf_conntrack_ipv4 and nf_conntrack_ipv6 were folded into nf_conntrack
# in Linux 4.19 and no longer exist. Listing them makes
# systemd-modules-load.service fail on every boot for no gain.
nf_conntrack

# BBR congestion control.
# net.ipv4.tcp_congestion_control = bbr in sysctl.d only takes effect once
# this module is present; without it the kernel silently keeps cubic.
tcp_bbr
