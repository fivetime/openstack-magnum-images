# systemd units do not read /etc/security/limits.d; limits have to be set on
# the unit. Without this the containerd process keeps the systemd default
# (LimitNOFILE=1024 on some distros), no matter what limits.d says.
[Service]
LimitNOFILE=1048576
LimitNPROC=131072
LimitMEMLOCK=infinity
LimitCORE=0
