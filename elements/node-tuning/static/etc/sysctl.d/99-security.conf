# ==========================================================
# Hardening for a node that runs untrusted workloads
# ==========================================================
#
# Every line here costs something. What it costs is written next to it, so a
# cluster that needs the capability back knows exactly which line to drop
# rather than deleting the whole file.

# Containers cannot read the kernel ring buffer.
kernel.dmesg_restrict = 1

# Hide kernel pointers.
#
# COST: /proc/kallsyms returns all zeros for every user including root, so
# BPF symbol resolution, perf, and bcc/bpftrace tooling stop producing usable
# stacks. Cilium's datapath is unaffected (tc/XDP attachment does not need
# kallsyms), but continuous profilers and kernel-stack flame graphs will be
# blank. Set to 1 if you run those.
kernel.kptr_restrict = 2

# No kexec: an attacker with CAP_SYS_BOOT cannot swap the running kernel.
kernel.kexec_load_disabled = 1

# COST: 3 disables perf_event_open for unprivileged users entirely, which
# breaks Parca, Pyroscope, and any in-cluster profiler that does not run
# privileged. Use 2 to keep userspace profiling while denying kernel tracing.
kernel.perf_event_paranoid = 3

# Unprivileged user namespaces are left enabled on purpose: gVisor, rootless
# builders and several CNI helpers need them. Uncomment only for a cluster
# that runs none of those.
# user.max_user_namespaces = 0

# Only privileged users may load BPF. Cilium runs as root, so its datapath is
# unaffected.
kernel.unprivileged_bpf_disabled = 1

kernel.randomize_va_space = 2

# COST: ptrace is restricted to descendants, so `kubectl debug`-style
# ephemeral containers cannot attach a debugger to a process in the target
# container. gVisor's systrap platform only traces its own children and is
# unaffected.
kernel.yama.ptrace_scope = 1
