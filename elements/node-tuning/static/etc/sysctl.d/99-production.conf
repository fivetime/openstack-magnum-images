# ==========================================================
# Production tuning for a Kubernetes node
# ==========================================================
#
# Applied by systemd-sysctl at boot, which runs after
# systemd-modules-load.service. That ordering is what makes the keys below
# that only exist once a module is loaded (bridge.*, netfilter.*) resolve.
# Do not try to apply this file inside a build chroot; the modules are not
# there and the keys do not exist yet.

# --- File system limits ---
fs.file-max = 2097152
fs.nr_open = 2097152
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288

# --- Forwarding ---
# Kubernetes needs IPv4 forwarding for pod traffic; the IPv6 keys keep a
# dual-stack cluster symmetric.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1

# --- TCP performance ---
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864

net.core.somaxconn = 32768
net.ipv4.tcp_max_syn_backlog = 8192
net.core.netdev_max_backlog = 16384

net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1

# Requires the tcp_bbr module, which modules-load.d/99-container.conf loads.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_notsent_lowat = 16384

net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 5

net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_syncookies = 1

# --- Ephemeral port range ---
net.ipv4.ip_local_port_range = 32768 60999

# --- Connection tracking ---
net.netfilter.nf_conntrack_max = 2097152

# --- Neighbour tables ---
# A node running hundreds of pods behind a single NIC blows through the
# default thresholds and starts dropping neighbour entries under load.
net.ipv4.neigh.default.gc_thresh1 = 8192
net.ipv4.neigh.default.gc_thresh2 = 32768
net.ipv4.neigh.default.gc_thresh3 = 65536
net.ipv6.neigh.default.gc_thresh1 = 8192
net.ipv6.neigh.default.gc_thresh2 = 32768
net.ipv6.neigh.default.gc_thresh3 = 65536

# --- Network device ---
net.core.optmem_max = 25165824
net.core.netdev_budget = 1000
net.core.netdev_budget_usecs = 5000

# --- Bridge netfilter (Kubernetes) ---
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1

# --- BPF (Cilium) ---
net.core.bpf_jit_enable = 1
net.core.bpf_jit_harden = 0

# --- Memory ---
vm.swappiness = 1
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.vfs_cache_pressure = 50
vm.overcommit_memory = 1
vm.max_map_count = 524288

# --- Processes and threads ---
kernel.pid_max = 4194304
kernel.threads-max = 4194304

# --- Stability ---
# A node that oopses is more useful rebooted than wedged: the control plane
# reschedules its pods, which a half-dead kubelet prevents.
kernel.core_pattern = /dev/null
kernel.panic = 10
kernel.panic_on_oops = 1

# --- ICMP ---
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv6.icmp.ratelimit = 1000

# --- Redirects ---
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# --- Source routing ---
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# --- Reverse path filtering ---
# Off, not because of BGP here, but because pod traffic legitimately arrives
# on an interface that is not the one the return route points at. Calico
# documents rp_filter=0; Cilium's masquerading has the same requirement.
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0
