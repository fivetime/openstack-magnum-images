# ==========================================================
# Resource limits for a high-density container node
# ==========================================================
#
# These bound interactive and PAM-mediated sessions. Services started by
# systemd do NOT read this file - their limits come from the unit, which is
# why kubelet and containerd get their own drop-ins under
# /etc/systemd/system/*.service.d/99-limits.conf.

# File descriptors
* soft nofile 1048576
* hard nofile 1048576
root soft nofile 1048576
root hard nofile 1048576

# Processes
* soft nproc 131072
* hard nproc 131072
root soft nproc 131072
root hard nproc 131072

# Locked memory
* soft memlock unlimited
* hard memlock unlimited
root soft memlock unlimited
root hard memlock unlimited

# Core dumps off; kernel.core_pattern = /dev/null backs this up for anything
# that raises its own limit.
* soft core 0
* hard core 0
root soft core 0
root hard core 0

# Stack
* soft stack 32768
* hard stack unlimited
root soft stack 32768
root hard stack unlimited
